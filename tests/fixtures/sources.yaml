sources:
  - name: daily-notes
    type: local_files
    path: ~/notes/**/*.md
    privacy: private

  - name: projects
    type: git_repos
    paths:
      - ~/projects/*
    extract:
      - readme
      - recent_commits
    privacy: public

  - name: reading
    type: rss
    url: https://example.com/feed.xml
    privacy: public

  - name: custom-source
    type: custom
    connector: connectors/example.py
    config:
      api_key: test
    privacy: public
